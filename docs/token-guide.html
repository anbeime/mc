<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1160px; background:#f6f5f2; font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; color:#1a1a1a; padding:38px 40px 30px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:-0.3px; }
  .sub { font-size:15px; color:#6d6a64; margin-top:8px; margin-bottom:26px; }
  .card { background:#fff; border:1px solid #e4e1d9; border-radius:14px; overflow:hidden; margin-bottom:20px; }
  .head { display:flex; align-items:center; gap:13px; padding:15px 22px; border-bottom:1px solid #f1eee7; }
  .num { width:28px; height:28px; border-radius:50%; background:#FFC72C; color:#3a2a00; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .t { font-size:17px; font-weight:600; }
  .d { font-size:13.5px; color:#7a776f; margin-left:auto; }
  img { display:block; width:100%; }
  .foot { margin-top:24px; padding:16px 20px; background:#FFF7DF; border-left:4px solid #FFC72C; border-radius:0 10px 10px 0; font-size:14px; line-height:1.75; color:#5a4400; }
  .foot b { font-weight:600; }
</style>
</head>
<body>
  <h1>申请麦当劳 MCP Token · 操作对照</h1>
  <div class="sub">全程只用鼠标点三下：登录 → 激活 → 复制。下面红框就是你要点的位置。</div>

  <div class="card">
    <div class="head">
      <div class="num">1</div>
      <div class="t">右上角点「登录」</div>
      <div class="d">页面最右上角，黄色按钮，红框处</div>
    </div>
    <img src="step1.jpeg" alt="点右上角登录">
  </div>

  <div class="card">
    <div class="head">
      <div class="num">2</div>
      <div class="t">弹窗里点「激活」</div>
      <div class="d">登录后点右上角「控制台」弹出此窗，红框处</div>
    </div>
    <img src="step4.png" alt="点激活按钮">
  </div>

  <div class="card">
    <div class="head">
      <div class="num">3</div>
      <div class="t">点最左边那个「复制」图标</div>
      <div class="d">Token 以 mcdt 开头，复制后先存记事本</div>
    </div>
    <img src="step6.png" alt="复制 Token">
  </div>

  <div class="foot">
    <b>注意：</b>官方明确提示「此 MCP Token 代表您的麦当劳会员身份，请严禁分享」。所以别把它贴到 GitHub、群聊或公开截图里。Token 全程只用手机号验证码登录获取，不需要付任何费用。
  </div>
</body>
</html>
